name: TooneMobile
options:
  bundleIdPrefix: com.toone
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

targets:
  TooneMobile:
    type: application
    platform: iOS
    sources:
      - TooneMobile
    resources:
      - path: TooneMobile/Resources
    dependencies:
      - package: MarkdownUI
    settings:
      base:
        INFOPLIST_FILE: TooneMobile/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.toone.mobile

  TooneMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TooneMobileTests
    dependencies:
      - target: TooneMobile
